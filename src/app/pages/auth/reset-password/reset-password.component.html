<ion-content scroll-y="false" fullscreen class="ion-padding">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button text="voltar" color="dark-indigo" />
      </ion-buttons>
    </ion-toolbar>
  </ion-header>


  <form [formGroup]="renewPasswordForm" (submit)="renewPassword()">
    <ion-grid>

      <ion-input mode="md" type="password" label="Senha de acesso" labelPlacement="floating" fill="outline"
        color="warning" formControlName="password">

        <ion-input-password-toggle slot="end" color="warning" />

      </ion-input>


      @if (password?.invalid || password?.dirty)  {

        <ion-text>
          <ion-icon [color]="password?.hasError('required') || password?.value === '' ? 'danger' : 'success' "
            [name]="password?.hasError('required')  ? 'close-circle-outline' : 'checkmark-circle-outline' " />
          {{ inputErros('required') }}
        </ion-text>

        <ion-text>
          <ion-icon [color]="password?.hasError('minlength') || password?.value === '' ? 'danger' : 'success' "
            [name]="password?.hasError('minlength') || password?.value === '' ? 'close-circle-outline' : 'checkmark-circle-outline' " />
          {{ inputErros('minlength') }}
        </ion-text>


        <ion-text>
          <ion-icon [color]="password?.hasError('pattern') || password?.value === '' ? 'danger' : 'success' "
            [name]="password?.hasError('pattern') || password?.value === ''  ? 'close-circle-outline' : 'checkmark-circle-outline' " />
          {{ inputErros('pattern') }}
        </ion-text>

      }

      <ion-button id="submit" type="submit" expand="block" color="warning" [disabled]="renewPasswordForm.invalid">

        @if (loading()) {
          <ion-spinner />
        } @else {
          {{ 'Recuperar Senha' }}
        }
      </ion-button>


    </ion-grid>
  </form>

</ion-content>
