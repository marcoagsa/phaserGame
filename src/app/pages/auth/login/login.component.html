<ion-content fullscreen class="ion-padding">

  <form [formGroup]="loginForm" (submit)="login()">
    <ion-grid>

      <ion-input mode="md" type="email" label="Email" labelPlacement="floating" fill="outline" placeholder="Email"
        color="warning" formControlName="email" />

      <ion-input mode="md" type="password" label="Senha de acesso" labelPlacement="floating" fill="outline"
        placeholder="Senha de acesso " color="warning" formControlName="password">

        <ion-input-password-toggle slot="end" color="warning" />

      </ion-input>

      <ion-button id="submit" type="submit" expand="block" color="warning" [disabled]="loginForm.invalid">
        {{ 'Autenticar' }}
      </ion-button>

      <ion-item button lines="none" (click)="goTo()">
        <ion-label>Recuperar Senha</ion-label>
      </ion-item>

    </ion-grid>
  </form>

</ion-content>
